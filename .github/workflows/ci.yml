name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: only the deploy job needs to write (it doesn't even need that
# here), so every job starts read-only by default.
permissions:
  contents: read

jobs:
  # Runner pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 19/10/2026, and
  # with it the whole build toolchain would change without a single commit here. Bump it
  # deliberately, in a PR that shows the build still passes.
  #
  # Actions run on their current majors (checkout@v7, setup-java@v6, upload-artifact@v7),
  # which no longer carry the deprecated Node 20 runtime: the seven annotations this
  # workflow used to print on every run are gone.
  #
  # Artifact storage is 500 MB on the free plan and it is metered in gigabyte-hours over
  # the month: a 1.5 GB cache plus 33 MB of artifacts per run exhausts it in days, and
  # when it runs out the upload of the APK and the web fails (`CreateArtifact: Artifact
  # storage quota has been hit`), which in turn skips `deploy web` and freezes the site
  # on an old build. That is why `cache` is off (the Flutter SDK cache alone was 1.5 GB)
  # and why the artifacts are kept for a day and only published from `main`. The cost is
  # ~40 s of SDK download per job; the benefit is a pipeline that keeps deploying.
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: false

      - name: Dependências
        run: flutter pub get

      - name: Gera os .g.dart (retrofit/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Os .g.dart commitados estão em dia?
        run: git diff --exit-code -- '*.g.dart'

      - name: flutter analyze
        # `--fatal-infos` means "treat info diagnostics as fatal". It states the
        # intent, it does not change the outcome: this SDK already declares it (and
        # `--fatal-warnings`) as `defaultsTo: true` in `analyze.dart`, so a plain
        # `flutter analyze` exits 1 as soon as one of those diagnostics exists.
        run: flutter analyze --fatal-infos

      - name: flutter test (com cobertura)
        run: flutter test --coverage

      - name: Sobe o relatório de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info
          # Short on purpose: every artifact counts against the 500 MB storage budget.
          retention-days: 3

  build-android:
    name: build APK
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Reconstrói a chave de release a partir do secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=appseries\nstoreFile=release.jks\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - name: Build do APK (release)
        run: flutter build apk --release

      - name: Sobe o APK
        # Only from `main`: the APK is a deliverable of the merge, and 23 MB per PR push
        # is what used to exhaust the storage budget.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: appseries-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-web:
    name: build web
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build do web
        run: flutter build web --release

      - name: Sobe o build web
        # The only consumer is `deploy web`, which runs on a push to `main` (see `if`
        # below): uploading from a PR would spend storage on a build nobody publishes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: appseries-web
          path: build/web
          retention-days: 1

  # Publishing lives here and only here: a merge into `main` ships the site. Any
  # other branch stops at the artifact above, so a PR cannot overwrite what the
  # team is using.
  deploy-web:
    name: deploy web
    runs-on: ubuntu-24.04
    needs: [build-web, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One publish at a time and in order: two merges close together would
    # otherwise race and the older build could land last. And a red APK means the
    # app is not shippable, so the site does not go out either.
    concurrency:
      group: hosting-live
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Baixa o build web do job anterior
        uses: actions/download-artifact@v7
        with:
          name: appseries-web
          path: build/web

      # Service account, not `firebase login:ci`: the CI token is deprecated and
      # carries the whole Google account, while this key only deploys this project.
      - name: Publica no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pos-app-c4297
          channelId: live
